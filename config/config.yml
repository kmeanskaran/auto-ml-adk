# Tunable settings for the ML engineer.
# Change a value here and restart the process.
# A set environment variable overrides that one value for the process:
#   ML_CONFIG, ML_DATA_ROOT, ML_RUNTIME_MODEL, OLLAMA_API_BASE,
#   ML_API_HOST, ML_API_PORT, ML_LOG_LEVEL, ML_API_CORS, ML_API_MAX_UPLOAD_BYTES,
#   ML_SESSION_BACKEND

provider:
  name: ollama
  model: gpt-oss:20b-cloud
  api_base: http://localhost:11434
  # LiteLLM route that advertises tools. The plain "ollama/" prefix can drop them.
  litellm_prefix: ollama_chat
  temperature: 0.1

session:
  # sqlite keeps ADK events across process restarts. in_memory is tests-only.
  backend: sqlite
  app_name: ml_engineer
  db_path: sessions.db

runtime:
  # Relative paths are from the repository root.
  root: data
  identity: ml-engineer@local
  user: local
  max_improvement_loops: 3
  approve_training: true
  blocked_tools:
    - run_analysis_snippet

experiment:
  objective: Which customers will cancel?
  target_column: churn
  metric: f1
  target_value: 0.75

sample_data:
  rows: 400
  seed: 7
  missing_rate: 0.08
  missing_seed: 1
  missing_columns:
    - monthly_charges
    - support_calls
    - contract

training:
  min_rows: 20
  test_size: 0.25
  random_state: 0
  threshold_start: 0.15
  threshold_stop: 0.85
  threshold_step: 0.01
  logistic_regression:
    max_iter: 400
    class_weight: balanced
  random_forest:
    n_estimators: 40
    max_depth: 8
    min_samples_leaf: 2
    n_jobs: 1
    class_weight: balanced_subsample
  gradient_boosting:
    n_estimators: 40
    max_depth: 2

sandbox:
  max_chars: 2000

api:
  host: 127.0.0.1
  port: 8000
  log_level: INFO
  cors_origins:
    - http://localhost:3000
  max_upload_bytes: 20000000

telemetry:
  disable_otel: true
