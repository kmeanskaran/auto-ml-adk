# Stage 3 of 3: deploys a commit that build finished on main.
#
#   backend   → Agent Runtime (agents-cli deploy uploads the source; Google builds it)
#   console   → Cloud Run, from build's image ml-team-console:<commit>, open to anyone
#   check     the deployed backend answers
#
# Signs in to Google Cloud through Workload Identity Federation (no keys), which trusts
# only this repository's main branch (deployment/terraform/ml-team-adk/ml_team.tf). The
# repository variables it reads come from `terraform output github_variables`.

name: deploy

on:
  workflow_run:
    workflows: [build]
    types: [completed]
    branches: [main]
  workflow_dispatch: # redeploy the newest commit on main (build must have run for it)

concurrency:
  group: deploy
  cancel-in-progress: false # never stop a deploy halfway

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Workload Identity Federation
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      PROJECT: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/cloud-run-source-deploy/ml-team-console
      AGENT_URL: https://${{ vars.GCP_REGION }}-aiplatform.googleapis.com/reasoningEngines/v1/projects/${{ vars.GCP_PROJECT_ID }}/locations/${{ vars.GCP_REGION }}/reasoningEngines/${{ vars.AGENT_ENGINE_ID }}/api
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: astral-sh/setup-uv@v6

      - name: The console image was built for this commit
        run: |
          gcloud artifacts docker images describe "$IMAGE:$SHA" --quiet >/dev/null ||
            { echo "::error::No image $IMAGE:$SHA. Run the build workflow for this commit first."; exit 1; }

      - name: Backend → Agent Runtime
        run: |
          uv tool install google-agents-cli==1.7.0
          ENV="GOOGLE_GENAI_USE_VERTEXAI=true,GOOGLE_CLOUD_LOCATION=global,ML_STATE_BUCKET=${{ vars.STATE_BUCKET }},OTEL_TO_CLOUD=true"
          if [ -n "${{ vars.ML_MODEL }}" ]; then ENV="$ENV,ML_MODEL=${{ vars.ML_MODEL }}"; fi
          agents-cli deploy \
            --project "$PROJECT" --region "$REGION" --no-confirm-project \
            --service-account "${{ vars.APP_SA }}" \
            --update-env-vars "$ENV" \
            --labels "commit=${SHA::12}"

      # Open to anyone: the console's URL needs no login. One instance, so its
      # requests to the agent stay under Agent Runtime's limit per caller.
      - name: Console → Cloud Run
        run: |
          gcloud run deploy ml-team-console --quiet \
            --project "$PROJECT" --region "$REGION" \
            --image "$IMAGE:$SHA" \
            --service-account "${{ vars.CONSOLE_SA }}" \
            --set-env-vars "BACKEND_URL=$AGENT_URL" \
            --clear-secrets --allow-unauthenticated --no-iap \
            --min-instances 0 --max-instances 1

      - name: Check the deployed backend answers
        run: |
          TOKEN="$(gcloud auth print-access-token)"
          for attempt in 1 2 3 4 5 6; do
            code="$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "$AGENT_URL/api/view")"
            echo "attempt $attempt: /api/view → $code"
            [ "$code" = 200 ] && break
            [ "$attempt" = 6 ] && exit 1
            sleep 20 # the agent may be starting from zero
          done
          URL="$(gcloud run services describe ml-team-console --project "$PROJECT" --region "$REGION" --format='value(status.url)')"
          echo "Console: $URL (commit ${SHA::12})" >> "$GITHUB_STEP_SUMMARY"
