# One workflow, three connected jobs; each starts only when the one before succeeded:
#
#   checks ──► build ──► deploy      a push to main (or run by hand)
#   checks                           a pull request: never builds or deploys
#
#   checks   the pre-commit hooks (.pre-commit-config.yaml: lint, format, private keys,
#            unit tests, console typecheck), then the console's production build.
#            No Google Cloud access.
#   build    console image → Artifact Registry as ml-team-console:<commit>; backend
#            image built to prove the Dockerfile works, not pushed: Agent Runtime takes
#            no prebuilt image (agents-cli deploy uploads the source; Google builds it)
#   deploy   backend → Agent Runtime; console → Cloud Run from build's image, open to
#            anyone; then checks the deployed backend answers
#
# build and deploy sign in to Google Cloud through Workload Identity Federation (no
# keys), which trusts only this repository's main branch
# (deployment/terraform/ml-team-adk/ml_team.tf). The repository variables they read
# come from `terraform output github_variables`.

name: deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false # never stop a deploy halfway

env:
  PROJECT: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/cloud-run-source-deploy/ml-team-console

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: |
          uv sync --frozen
          npm ci --prefix frontend --no-audit --no-fund
      - name: Pre-commit hooks (the same as on your machine)
        run: uvx pre-commit run --all-files --show-diff-on-failure
      - name: Console build
        run: npm --prefix frontend run build

  build:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Workload Identity Federation
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Docker → Artifact Registry
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
      - uses: docker/setup-buildx-action@v3

      - name: Backend image (checks the Dockerfile; not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Console image → Artifact Registry
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=console
          cache-to: type=gha,scope=console,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Workload Identity Federation
    env:
      AGENT_URL: https://${{ vars.GCP_REGION }}-aiplatform.googleapis.com/reasoningEngines/v1/projects/${{ vars.GCP_PROJECT_ID }}/locations/${{ vars.GCP_REGION }}/reasoningEngines/${{ vars.AGENT_ENGINE_ID }}/api
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: astral-sh/setup-uv@v6

      - name: Backend → Agent Runtime
        run: |
          uv tool install google-agents-cli==1.7.0
          ENV="GOOGLE_GENAI_USE_VERTEXAI=true,GOOGLE_CLOUD_LOCATION=global,ML_STATE_BUCKET=${{ vars.STATE_BUCKET }},OTEL_TO_CLOUD=true"
          if [ -n "${{ vars.ML_MODEL }}" ]; then ENV="$ENV,ML_MODEL=${{ vars.ML_MODEL }}"; fi
          agents-cli deploy \
            --project "$PROJECT" --region "$REGION" --no-confirm-project \
            --service-account "${{ vars.APP_SA }}" \
            --update-env-vars "$ENV" \
            --labels "commit=${GITHUB_SHA::12}"

      # Open to anyone: the console's URL needs no login. One instance, so its
      # requests to the agent stay under Agent Runtime's limit per caller.
      - name: Console → Cloud Run (the image build made)
        run: |
          gcloud run deploy ml-team-console --quiet \
            --project "$PROJECT" --region "$REGION" \
            --image "$IMAGE:$GITHUB_SHA" \
            --service-account "${{ vars.CONSOLE_SA }}" \
            --set-env-vars "BACKEND_URL=$AGENT_URL" \
            --clear-secrets --allow-unauthenticated --no-iap \
            --min-instances 0 --max-instances 1

      - name: Check the deployed backend answers
        run: |
          TOKEN="$(gcloud auth print-access-token)"
          for attempt in 1 2 3 4 5 6; do
            code="$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "$AGENT_URL/api/view")"
            echo "attempt $attempt: /api/view → $code"
            [ "$code" = 200 ] && break
            [ "$attempt" = 6 ] && exit 1
            sleep 20 # the agent may be starting from zero
          done
          URL="$(gcloud run services describe ml-team-console --project "$PROJECT" --region "$REGION" --format='value(status.url)')"
          echo "Console: $URL (commit ${GITHUB_SHA::12})" >> "$GITHUB_STEP_SUMMARY"
