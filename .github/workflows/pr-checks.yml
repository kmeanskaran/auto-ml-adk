# Stage 1 of 3: checks every pull request and every push to main.
#
#   pr-checks ──► build ──► deploy      (a push to main; each starts when the last succeeded)
#   pr-checks                           (a pull request: never builds or deploys)
#
# The same pre-commit hooks as on your machine (.pre-commit-config.yaml: lint, format,
# private keys, unit tests, console typecheck), then the console's production build.
# Needs no Google Cloud access.

name: pr-checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true # a newer commit replaces an older check

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: |
          uv sync --frozen
          npm ci --prefix frontend --no-audit --no-fund
      - name: Pre-commit hooks (the same as on your machine)
        run: uvx pre-commit run --all-files --show-diff-on-failure
      - name: Console build
        run: npm --prefix frontend run build
